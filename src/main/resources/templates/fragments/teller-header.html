<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teller Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0-alpha1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .header-separator {
            height: 2px; /* Adjust height as needed */
            background-color: #e9ecef; /* Light grey color */
            margin-top: 10px; /* Space above the separator */
        }
    </style>
</head>
<body>
    <header th:fragment="teller-header">
        <!-- Bootstrap 5 Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
            <div class="container-fluid">
                <!-- Brand Logo -->
                <a class="navbar-brand d-flex align-items-center" href="/teller/dashboard">
                    <i class="fas fa-money-check-alt fa-2x me-2"></i> <!-- Use a money check icon -->
                    <span class="fs-4">Teller Dashboard</span>
                </a>

                <!-- Toggle Button for Mobile View -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Navbar Links and User Profile -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <!-- Dashboard Link -->
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/teller/dashboard}">
                                <i class="fas fa-tachometer-alt"></i> Dashboard
                            </a>
                        </li>

                        <!-- Transactions Link -->
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/teller/transactions}">
                                <i class="fas fa-exchange-alt"></i> Transactions
                            </a>
                        </li>

                        <!-- Accounts Link -->
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/teller/accounts}">
                                <i class="fas fa-user-circle"></i> Accounts
                            </a>
                        </li>

                        <!-- Loans Link -->
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/teller/loans}">
                                <i class="fas fa-file-invoice-dollar"></i> Loans
                            </a>
                        </li>

                        <!-- Notifications Icon -->
                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                <i class="fas fa-bell"></i>
                                <span class="badge bg-danger">3</span>
                            </a>
                        </li>

                        <!-- User Profile Dropdown -->
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas fa-user"></i> Teller
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                                <li><a class="dropdown-item" href="/user/profile"><i class="fas fa-user-cog"></i> Profile</a></li>
                                <li><a class="dropdown-item" href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Optional: Add a line to separate the header from the body -->
        <div class="header-separator"></div>
    </header>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    

</body>
</html>
