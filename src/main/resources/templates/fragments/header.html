<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <title>Your Application Title</title>
    <style>
        .navbar {
            margin-bottom: 20px;
        }
        .dropdown-menu {
            min-width: 200px; /* Minimum width for the dropdown */
            max-width: calc(100vw - 20px); /* Max width adjusted for screen size */
            position: absolute; /* Ensure dropdown is positioned absolutely */
            z-index: 1000; /* Ensure it is above other elements */
        }
        .placeholder-img {
            background-color: #ddd;
            display: inline-block;
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }
        .navbar-brand {
            font-family: 'Poppins', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #2c3e50 !important; 
            text-transform: uppercase;  
            letter-spacing: 2px;        
        }
        .navbar-brand span {
            color: #3498db; 
        }
        .nav-link {
            display: flex;
            align-items: center; /* Center icon and text vertically */
        }
        .nav-link i {
            margin-right: 8px; /* Space between icon and text */
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">OB<span>MS</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item" th:class="${page == 'account' ? 'active' : ''}">
                        <a class="nav-link" href="/account/account_list"><i class="fas fa-user"></i> Accounts</a>
                    </li>
                    <li class="nav-item" th:class="${page == 'transaction' ? 'active' : ''}">
                        <a class="nav-link" href="/transaction/transaction_list"><i class="fas fa-money-check-alt"></i> Transactions</a>
                    </li>
                    <li class="nav-item" th:class="${page == 'atm' ? 'active' : ''}">
                        <a class="nav-link" href="/atm/list"><i class="fas fa-money-bill-wave"></i> ATMs</a>
                    </li>
                    <li class="nav-item" th:class="${page == 'branch' ? 'active' : ''}">
                        <a class="nav-link" href="/branch/list"><i class="fas fa-building"></i> Branches</a>
                    </li>
                </ul>
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle" type="button" id="profileMenu" data-bs-toggle="dropdown" aria-expanded="false">
                        <span class="placeholder-img" id="profilePlaceholder"></span>
                        <span class="visually-hidden">User Profile Menu</span>
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="profileMenu">
                        <li><a class="dropdown-item" href="/user/profile"><i class="fas fa-user-circle"></i> View Profile</a></li>
                        <li><a class="dropdown-item" href="/user/manage_profile"><i class="fas fa-edit"></i> Edit Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/settings"><i class="fas fa-cog"></i> Settings</a></li>
                        <li><a class="dropdown-item" href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Your page content goes here -->
    </div>

    <script>
        // Adjust the dropdown position
        document.addEventListener('DOMContentLoaded', function () {
            const dropdownToggle = document.getElementById('profileMenu');
            const dropdownMenu = dropdownToggle.nextElementSibling;

            dropdownToggle.addEventListener('click', function () {
                const rect = dropdownToggle.getBoundingClientRect();
                const dropdownRect = dropdownMenu.getBoundingClientRect();

                // Check if dropdown exceeds viewport width
                if (dropdownRect.right > window.innerWidth) {
                    dropdownMenu.style.left = 'auto'; // Reset left position
                    dropdownMenu.style.right = '0'; // Align to the right of the toggle
                } else {
                    dropdownMenu.style.left = '0'; // Reset to default left position
                    dropdownMenu.style.right = 'auto'; // Reset right position
                }
            });
        });
    </script>

    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
