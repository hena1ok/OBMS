<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Tickets - Bank Management System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <!-- Include Header based on Role -->
	<div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
		<div th:replace="fragments/admin-header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''USER'')')}">
		<div th:replace="fragments/header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''TELLER'')')}">
		<div th:replace="fragments/teller-header.html"></div>
	</div>
	<div
		th:if="${#authorization.expression('hasRole(''SUPPORT'')')}">
		<div th:replace="fragments/support-header.html"></div>
	</div>

    <div class="d-flex">
        <!-- Sidebar -->

        <!-- Main Content -->
        <div id="main-content" class="container-fluid p-4" style="min-height: 100vh; background-color: #f8f9fa;">
            <h1 class="display-6">Manage Tickets</h1>

            <!-- Ticket Search -->
            <form class="mb-3" th:action="@{/support/search_tickets}" method="get">
                <div class="input-group">
                    <input type="text" name="query" class="form-control" placeholder="Search by issue details..." required>
                    <button class="btn btn-primary" type="submit">Search</button>
                </div>
            </form>

            <!-- Ticket List -->
            <div class="card shadow-sm mt-4">
                <div class="card-body">
                    <table class="table table-bordered table-hover">
                        <thead>
                            <tr>
                                <th>Ticket ID</th>
                                <th>User</th>
                                <th>Issue Details</th>
                                <th>Status</th>
                                <th>Created At</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ticket : ${tickets}">
                                <td th:text="${ticket.ticketId}"></td>
                                <td th:text="${ticket.user.username}"></td>
                                <td th:text="${ticket.issueDetails}"></td>
                                <td th:text="${ticket.status}"></td>
                                <td th:text="${ticket.createdAt}"></td>
                                <td>
                                    <a th:href="@{/support/ticket/{id}(id=${ticket.ticketId})}" class="btn btn-info">View</a>
                                    <form th:action="@{/support/ticket/update/{id}(id=${ticket.ticketId})}" method="post" style="display:inline;">
                                        <select name="status" class="form-select d-inline" style="width:auto;">
                                            <option value="OPEN" th:selected="${ticket.status == 'OPEN'}">Open</option>
                                            <option value="IN_PROGRESS" th:selected="${ticket.status == 'IN_PROGRESS'}">In Progress</option>
                                            <option value="CLOSED" th:selected="${ticket.status == 'CLOSED'}">Closed</option>
                                            <option value="ESCALATED" th:selected="${ticket.status == 'ESCALATED'}">Escalated</option>
                                        </select>
                                        <button type="submit" class="btn btn-sm btn-secondary">Update</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Add New Ticket Button -->
            <div class="mt-3 text-end">
                <a th:href="@{/support/create_ticket}" class="btn btn-success">Create New Ticket</a>
            </div>
        </div>
    </div>

    <script>
        // Sidebar toggle function
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleIcon = document.getElementById('toggleIcon');
            sidebar.classList.toggle('sidebar-collapsed');
            sidebar.classList.toggle('sidebar-expanded');
            toggleIcon.classList.toggle('rotate-icon');
        }
    </script>
</body>

</html>
