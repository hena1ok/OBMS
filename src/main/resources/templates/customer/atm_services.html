<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATM Services</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
	<!-- Include Header based on Role -->
	<div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
		<div th:replace="fragments/admin-header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''USER'')')}">
		<div th:replace="fragments/header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''TELLER'')')}">
		<div th:replace="fragments/teller-header.html"></div>
	</div>
	<div
		th:if="${#authorization.expression('hasRole(''CUSTOMERSERVICE'')')}">
		<div th:replace="fragments/customerservice-header.html"></div>
	</div>
	<div class="container mt-5">
		<h1 class="text-center">ATM Locations</h1>
		<table class="table table-striped mt-3">
			<thead>
				<tr>
					<th>ID</th>
					<th>Location</th>
					<th>Status</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="atm : ${atms}">
					<td th:text="${atm.id}"></td>
					<td th:text="${atm.location}"></td>
					<td th:text="${atm.status}"></td>
				</tr>
			</tbody>
		</table>
	</div>

	<!-- Include Footer -->
	<div th:replace="fragments/footer.html"></div>
</body>
</html>
