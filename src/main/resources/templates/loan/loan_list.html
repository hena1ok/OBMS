<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan List</title>
<link rel="stylesheet"
	href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
	<!-- Include Header based on Role -->
	<div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
		<div th:replace="fragments/admin-header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''USER'')')}">
		<div th:replace="fragments/header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''TELLER'')')}">
		<div th:replace="fragments/teller-header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''SUPPORT'')')}">
		<div th:replace="fragments/support-header.html"></div>
	</div>
	<div class="container mt-5">
		<h1 class="mb-4">Loan List</h1>

		<!-- Success or error message display -->
		<div th:if="${successMessage}" class="alert alert-success"
			role="alert" th:text="${successMessage}"></div>
		<div th:if="${errorMessage}" class="alert alert-danger" role="alert"
			th:text="${errorMessage}"></div>

		<!-- Only users with ROLE_ADMIN or ROLE_TELLER can apply for a new loan -->
		<div class="mb-3">
			<a th:href="@{/loan/apply}" class="btn btn-primary"
				sec:authorize="hasAnyRole('ROLE_ADMIN', 'ROLE_TELLER')">Apply
				for a New Loan</a>
		</div>

		<div class="row">
			<div class="col-md-12">
				<table class="table table-striped table-bordered table-responsive">
					<thead>
						<tr>
							<th>ID</th>
							<th>Amount</th>
							<th>Interest Rate</th>
							<th>Term (Months)</th>
							<th>Start Date</th>
							<th>Status</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="loan : ${loans}">
							<td th:text="${loan.id}"></td>
							<td th:text="${loan.amount}"></td>
							<td th:text="${loan.interestRate}"></td>
							<td th:text="${loan.term}"></td>
							<td th:text="${loan.startDate}"></td>
							<td th:text="${loan.status}"></td>
							<td>
								<!-- Form for Approving Loan -->
								<form th:action="@{/loan/approve/{id}(id=${loan.id})}"
									method="post" style="display: inline;">
									<button type="submit" class="btn btn-success btn-sm"
										sec:authorize="hasRole('ROLE_ADMIN')">Approve</button>
								</form> <!-- Link for Rejecting Loan -->
								<form th:action="@{/loan/reject/{id}(id=${loan.id})}"
									method="post" style="display: inline;">
									<button type="submit" class="btn btn-danger btn-sm"
										sec:authorize="hasRole('ROLE_ADMIN')">Reject</button>
								</form> <!-- Link for Editing Loan --> <a
								th:href="@{/loan/edit/{id}(id=${loan.id})}"
								class="btn btn-warning btn-sm"
								sec:authorize="hasRole('ROLE_ADMIN')">Edit</a>
							</td>


						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<!-- Include the footer -->
	<div th:replace="fragments/footer"></div>

	<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
	<script
		src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
