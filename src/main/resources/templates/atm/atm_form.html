<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATM Form</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
	rel="stylesheet">
<style>
body {
	font-family: 'Arial', sans-serif;
}

.form-container {
	margin-top: 50px;
	max-width: 600px;
	margin-left: auto;
	margin-right: auto;
}
</style>
</head>
<body>
	<!-- Include Header based on Role -->
	<div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
		<div th:replace="fragments/admin-header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''USER'')')}">
		<div th:replace="fragments/header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''TELLER'')')}">
		<div th:replace="fragments/teller-header.html"></div>
	</div>
	<div
		th:if="${#authorization.expression('hasRole(''SUPPORT'')')}">
		<div th:replace="fragments/support-header.html"></div>
	</div>
	<div class="container">
		<h1 class="text-center mt-5 mb-4">ATM Form</h1>

		<div class="form-container">
			<form th:action="@{/atm/form}" th:object="${atm}" method="post"
				class="needs-validation" novalidate>
				<!-- Location Field -->
				<div class="mb-3">
					<label for="location" class="form-label">Location</label> <input
						type="text" class="form-control" id="location"
						th:field="*{location}" placeholder="Enter ATM location" required>
					<div class="invalid-feedback">Please enter a valid location.</div>
				</div>

				<!-- Cash Available Field -->
				<div class="mb-3">
					<label for="cashAvailable" class="form-label">Cash
						Available</label> <input type="number" class="form-control"
						id="cashAvailable" th:field="*{cashAvailable}"
						placeholder="Enter available cash" min="0" required>
					<div class="invalid-feedback">Please enter a valid amount of
						cash available.</div>
				</div>

				<!-- Max Withdrawal Per Transaction Field -->
				<div class="mb-3">
					<label for="maxWithdrawalPerTransaction" class="form-label">Max
						Withdrawal Per Transaction</label> <input type="number"
						class="form-control" id="maxWithdrawalPerTransaction"
						th:field="*{maxWithdrawalPerTransaction}"
						placeholder="Enter max withdrawal" min="0" required>
					<div class="invalid-feedback">Please enter a valid maximum
						withdrawal amount.</div>
				</div>

				<!-- Daily Withdrawal Limit Field -->
				<div class="mb-3">
					<label for="dailyWithdrawalLimit" class="form-label">Daily
						Withdrawal Limit</label> <input type="number" class="form-control"
						id="dailyWithdrawalLimit" th:field="*{dailyWithdrawalLimit}"
						placeholder="Enter daily limit" min="0" required>
					<div class="invalid-feedback">Please enter a valid daily
						withdrawal limit.</div>
				</div>

				<!-- Status Field -->
				<div class="mb-3">
					<label for="status" class="form-label">Status</label> <select
						class="form-select" id="status" th:field="*{status}" required>
						<option value="" disabled selected>Select status</option>
						<option value="ONLINE">Online</option>
						<option value="OFFLINE">Offline</option>
						<option value="MAINTENANCE">Maintenance</option>
					</select>

					<div class="invalid-feedback">Please select a status.</div>
				</div>

				<!-- Submit Button -->
				<div class="d-grid">
					<button type="submit" class="btn btn-primary btn-lg">Save
						ATM</button>
				</div>
			</form>

			<!-- Back Button -->
			<div class="text-center mt-3">
				<a th:href="@{/atm/list}" class="btn btn-secondary">Back to ATM
					List</a>
			</div>
		</div>
	</div>
	<!-- Include the footer -->
	<div th:replace="fragments/footer"></div>


	
	<script>
		// Custom validation for Bootstrap
		(function() {
			'use strict'
			var forms = document.querySelectorAll('.needs-validation')
			Array.prototype.slice.call(forms).forEach(function(form) {
				form.addEventListener('submit', function(event) {
					if (!form.checkValidity()) {
						event.preventDefault()
						event.stopPropagation()
					}
					form.classList.add('was-validated')
				}, false)
			})
		})()
	</script>

</body>
</html>
