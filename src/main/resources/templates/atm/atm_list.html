<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATM List</title>
<link rel="stylesheet"
	href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<style>
.atm-card {
	margin-bottom: 20px; /* Adds spacing between cards */
}
</style>
</head>
<body>
	<!-- Include Header based on Role -->
	<div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
		<div th:replace="fragments/admin-header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''USER'')')}">
		<div th:replace="fragments/header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''TELLER'')')}">
		<div th:replace="fragments/teller-header.html"></div>
	</div>
	<div
		th:if="${#authorization.expression('hasRole(''SUPPORT'')')}">
		<div th:replace="fragments/support-header.html"></div>
	</div>

	<div class="container mt-5">
		<h1 class="mb-4">ATM List</h1>

		<!-- Display success or error messages -->
		<div th:if="${successMessage}" class="alert alert-success"
			role="alert" th:text="${successMessage}"></div>
		<div th:if="${errorMessage}" class="alert alert-danger" role="alert"
			th:text="${errorMessage}"></div>

		<!-- Button to add new ATM, visible to ROLE_ADMIN and ROLE_TELLER -->
		<div class="mb-3">
			<a th:href="@{/atm/form}" class="btn btn-primary"
				sec:authorize="hasAnyRole('ROLE_ADMIN', 'ROLE_TELLER')">Add New
				ATM</a>
		</div>

		<div class="row">
			<div class="col-md-12">
				<table class="table table-bordered table-responsive">
					<thead>
						<tr>
							<th>ID</th>
							<th>Location</th>
							<th>Cash Available</th>
							<th>Max Withdrawal</th>
							<th>Daily Withdrawal Limit</th>
							<th>Status</th>
							<th>Cash Denominations</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="atm : ${atms}">
							<td th:text="${atm.id}"></td>
							<td th:text="${atm.location}"></td>
							<td th:text="${atm.cashAvailable}"></td>
							<td th:text="${atm.maxWithdrawalPerTransaction}"></td>
							<td th:text="${atm.dailyWithdrawalLimit}"></td>
							<td th:text="${atm.status}"></td>
							<td>
								<ul>
									<li th:each="entry : ${atm.cashDenominations.entrySet()}"
										th:text="${entry.key} + ' - ' + ${entry.value}"></li>
								</ul>
							</td>
							<td>
								<!-- Edit button for ROLE_ADMIN and ROLE_TELLER --> <a
								th:href="@{/atm/form/{id}(id=${atm.id})}"
								class="btn btn-warning btn-sm"
								sec:authorize="hasAnyRole('ROLE_ADMIN', 'ROLE_TELLER')">Edit</a>

								<!-- Delete button for ROLE_ADMIN only --> <a
								th:href="@{/atm/delete/{id}(id=${atm.id})}"
								class="btn btn-danger btn-sm"
								onclick="return confirm('Are you sure you want to delete this ATM?');"
								sec:authorize="hasRole('ROLE_ADMIN')">Delete</a>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<!-- Include the footer -->
	<div th:replace="fragments/footer"></div>

	<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
	<script
		src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
