<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>
<link
	href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
	rel="stylesheet">
<style>
body {
	font-family: 'Arial', sans-serif;
	background-color: #f8f9fa;
	margin: 0;
	padding: 0;
}

.card {
	border: none;
	border-radius: 8px;
	box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
	margin-top: 60px;
}

.card-title {
	font-weight: bold;
}

.text-danger {
	font-size: 0.9em;
}

.card-body {
	padding: 2rem;
}
</style>
</head>
<body>

	<!-- Include Header -->
	<div th:replace="~{fragments/header.html}"></div>

	<div class="container">
		<div class="row justify-content-center">
			<div class="col-lg-5 col-md-7 col-sm-9">
				<div class="card">
					<div class="card-body">
						<h3 class="card-title text-center">Sign Up</h3>
						<form th:action="@{/signup}" method="post" th:object="${user}">
							<div class="form-group">
								<label for="username">Username:</label> <input type="text"
									class="form-control" id="username" th:field="*{username}"
									placeholder="Enter username" required>
								<div class="text-danger"
									th:if="${#fields.hasErrors('username')}"
									th:errors="*{username}"></div>
							</div>
							<div class="form-group">
								<label for="password">Password:</label> <input type="password"
									class="form-control" id="password" th:field="*{password}"
									placeholder="Enter password" required>
								<div class="text-danger"
									th:if="${#fields.hasErrors('password')}"
									th:errors="*{password}"></div>
							</div>
							<div class="form-group">
								<label for="confirmPassword">Confirm Password:</label> <input
									type="password" class="form-control" id="confirmPassword"
									name="confirmPassword" placeholder="Re-enter password" required>
								<div class="text-danger"
									th:if="${#fields.hasErrors('confirmPassword')}"
									th:errors="*{confirmPassword}"></div>
							</div>
							<div class="form-group">
								<label for="email">Email:</label> <input type="email"
									class="form-control" id="email" th:field="*{email}"
									placeholder="Enter email" required>
								<div class="text-danger" th:if="${#fields.hasErrors('email')}"
									th:errors="*{email}"></div>
							</div>
							<div class="form-group">
								<label for="firstName">First Name:</label> <input type="text"
									class="form-control" id="firstName" th:field="*{firstName}"
									placeholder="Enter first name" required>
								<div class="text-danger"
									th:if="${#fields.hasErrors('firstName')}"
									th:errors="*{firstName}"></div>
							</div>
							<div class="form-group">
								<label for="lastName">Last Name:</label> <input type="text"
									class="form-control" id="lastName" th:field="*{lastName}"
									placeholder="Enter last name" required>
								<div class="text-danger"
									th:if="${#fields.hasErrors('lastName')}"
									th:errors="*{lastName}"></div>
							</div>
							<div class="form-group">
								<label for="phone">Phone Number:</label> <input type="text"
									class="form-control" id="phone" th:field="*{phone}"
									placeholder="Enter phone number" required>
								<div class="text-danger" th:if="${#fields.hasErrors('phone')}"
									th:errors="*{phone}"></div>
							</div>
							<div class="form-group">
								<label for="address">Address:</label> <input type="text"
									class="form-control" id="address" th:field="*{address}"
									placeholder="Enter address" required>
								<div class="text-danger" th:if="${#fields.hasErrors('address')}"
									th:errors="*{address}"></div>
							</div>
							<div class="form-group">
								<label for="dob">Date of Birth:</label> <input type="date"
									class="form-control" id="dob" th:field="*{dob}" required>
								<div class="text-danger" th:if="${#fields.hasErrors('dob')}"
									th:errors="*{dob}"></div>
							</div>
							<div class="form-group">
								<label for="accountType">Account Type:</label> <select
									class="form-control" id="accountType" th:field="*{accountType}"
									required>
									<option value="">Select account type</option>
									<option value="${User.SAVINGS_ACCOUNT}">Savings</option>
									<option value="${User.CURRENT_ACCOUNT}">Current</option>
									<option value="${User.FIXED_DEPOSIT}">Fixed Deposit</option>
								</select>
								<div class="text-danger"
									th:if="${#fields.hasErrors('accountType')}"
									th:errors="*{accountType}"></div>
							</div>
							<button type="submit" class="btn btn-primary btn-block">Sign
								Up</button>
						</form>
						<p class="text-center mt-3">
							Already have an account? <a th:href="@{/login}">Login here</a>
						</p>
						<p th:if="${message}" th:text="${message}"
							class="text-success text-center mt-3"></p>
						<p th:if="${error}" th:text="${error}"
							class="text-danger text-center mt-3"></p>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Include Footer -->
	<div th:replace="fragments/footer.html"></div>

	<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
	<script
		src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
