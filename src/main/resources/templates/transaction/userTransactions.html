<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions by User</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <!-- Role-based Header -->
    <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
        <div th:replace="fragments/admin-header.html"></div>
    </div>
    <div th:if="${#authorization.expression('hasRole(''USER'')')}">
        <div th:replace="fragments/header.html"></div>
    </div>
    <div th:if="${#authorization.expression('hasRole(''TELLER'')')}">
        <div th:replace="fragments/teller-header.html"></div>
    </div>
    <div th:if="${#authorization.expression('hasRole(''SUPPORT'')')}">
        <div th:replace="fragments/support-header.html"></div>
    </div>

    <!-- Main content -->
    <div class="container mt-5">
        <h2 class="text-center mb-4">Transaction Management</h2>

        <!-- If no transactions found -->
        <div th:if="${#lists.isEmpty(transactions)}" class="alert alert-warning">
            No transactions found for this user.
        </div>

        <!-- Admin or Teller: Show all transactions -->
        <div th:if="${#authorization.expression('hasRole(''ADMIN'')') || #authorization.expression('hasRole(''TELLER'')')}">
            <h3>All Transactions</h3>
            <table class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">User</th>
                        <th scope="col">Amount</th>
                        <th scope="col">Type</th>
                        <th scope="col">Description</th>
                        <th scope="col">Date</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="transaction : ${transactions}">
                        <td th:text="${transaction.id}"></td>
                        <td th:text="${transaction.user.username}"></td>
                        <td th:text="${transaction.amount}"></td>
                        <td th:text="${transaction.transactionType}"></td>
                        <td th:text="${transaction.description}"></td>
                        <td th:text="${transaction.transactionDate}"></td>
                        <td>
                            <a th:href="@{/transaction/edit/{id}(id=${transaction.id})}" class="btn btn-warning btn-sm" title="Edit Transaction">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a th:href="@{/transaction/delete/{id}(id=${transaction.id})}" class="btn btn-danger btn-sm" 
                               onclick="return confirm('Are you sure you want to delete this transaction?');" 
                               title="Delete Transaction">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- User: Show only user-specific transactions -->
        <div th:if="${#authorization.expression('hasRole(''USER'')')}">
            <h3>Your Transactions</h3>
            <table class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Amount</th>
                        <th scope="col">Type</th>
                        <th scope="col">Description</th>
                        <th scope="col">Date</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="transaction : ${userTransactions}">
                        <td th:text="${transaction.id}"></td>
                        <td th:text="${transaction.amount}"></td>
                        <td th:text="${transaction.transactionType}"></td>
                        <td th:text="${transaction.description}"></td>
                        <td th:text="${transaction.transactionDate}"></td>
                        <td>
                            <a th:href="@{/transaction/edit/{id}(id=${transaction.id})}" class="btn btn-warning btn-sm" title="Edit Transaction">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a th:href="@{/transaction/delete/{id}(id=${transaction.id})}" class="btn btn-danger btn-sm" 
                               onclick="return confirm('Are you sure you want to delete this transaction?');" 
                               title="Delete Transaction">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Create new transaction -->
        <div class="text-right mb-3">
            <a th:href="@{/transactions/create}" class="btn btn-success">
                <i class="fas fa-plus"></i> Create New Transaction
            </a>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="fragments/footer"></div>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
