<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History - Bank Management System</title>
<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
	rel="stylesheet">
<!-- Custom CSS -->
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
	<!-- Include Header based on Role -->
	<div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
		<div th:replace="fragments/admin-header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''USER'')')}">
		<div th:replace="fragments/header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''TELLER'')')}">
		<div th:replace="fragments/teller-header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''SUPPORT'')')}">
		<div th:replace="fragments/support-header.html"></div>
	</div>
	<!-- Transaction List Section -->
	<section class="py-5">
		<div class="container">
			<h2 class="text-center">Transaction History</h2>

			<!-- Create Transaction Link - Visible only for users with the role 'ROLE_USER' or 'ROLE_ADMIN' -->
			<div class="text-end mb-4">
				<a href="/transaction/create" class="btn btn-primary"
					th:if="${#authentication.principal.userRoles.contains('ROLE_USER') or #authentication.principal.userRoles.contains('ROLE_ADMIN')}">
					Create Transaction </a>
			</div>

			<!-- Transaction Table -->
			<table class="table table-striped">
				<thead>
					<tr>
						<th>Date</th>
						<th>Type</th>
						<th>Amount</th>
						<th>Status</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="transaction : ${transactions}">
						<td th:text="${transaction.date}">2024-10-01</td>
						<td th:text="${transaction.type}">Deposit</td>
						<td th:text="${transaction.amount}">100.00</td>
						<td th:text="${transaction.status}">Completed</td>
					</tr>
				</tbody>
			</table>
		</div>
	</section>

	<!-- Footer -->
	<footer class="py-4">
		<div class="container text-center">
			<p>&copy; 2024 Bank Management System. All Rights Reserved.</p>
		</div>
	</footer>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
