<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teller Transactions</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <!-- Teller-specific header -->
    <div th:replace="fragments/teller-header.html"></div>

    <div class="container mt-5">
        <h1>Teller Transactions</h1>

        <!-- Display error message if there are no transactions -->
        <div th:if="${#lists.isEmpty(transactions)}" class="alert alert-warning">
            No transactions found for this teller.
        </div>

        <!-- Display transactions if available -->
        <div th:if="${!#lists.isEmpty(transactions)}">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Amount</th>
                        <th>Type</th>
                        <th>Description</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="transaction : ${transactions}">
                        <td th:text="${transaction.id}"></td>
                        <td th:text="${transaction.amount}"></td>
                        <td th:text="${transaction.transactionType}"></td>
                        <td th:text="${transaction.description}"></td>
                        <td th:text="${#temporals.format(transaction.transactionDate, 'yyyy-MM-dd')}"></td>
                        <td>
                            <a th:href="@{/transaction/edit/{id}(id=${transaction.id})}" class="btn btn-warning btn-sm" title="Edit Transaction">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a th:href="@{/transaction/delete/{id}(id=${transaction.id})}" class="btn btn-danger btn-sm" 
                               onclick="return confirm('Are you sure you want to delete this transaction?');" title="Delete Transaction">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Action buttons for teller -->
        <div class="mb-3">
            <a th:href="@{/transactions/create}" class="btn btn-success">
                <i class="fas fa-plus"></i> Create New Transaction
            </a>
            <a th:href="@{/transactions}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to All Transactions
            </a>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="fragments/footer.html"></div>
</body>
</html>
