<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }

        .card {
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-top: 60px;
        }

        .card-title {
            font-weight: bold;
        }

        .text-danger {
            font-size: 0.9em;
        }

        .card-body {
            padding: 2rem;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }

        /* Custom styles for the role selection */
        .select2-container {
            width: 100% !important;
        }
    </style>
    <!-- Include Select2 CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet" />
</head>

<body>

   <!-- Include Header based on Role -->
    <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
        <div th:replace="fragments/admin-header.html"></div>
    </div>
    <div th:if="${#authorization.expression('hasRole(''USER'')')}">
        <div th:replace="fragments/header.html"></div>
    </div>
    <div th:if="${#authorization.expression('hasRole(''TELLER'')')}">
        <div th:replace="fragments/teller-header.html"></div>
    </div>
    <div th:if="${#authorization.expression('hasRole(''SUPPORT'')')}">
        <div th:replace="fragments/support-header.html"></div>
    </div>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7 col-sm-9">
                <div class="card">
                    <div class="card-body">
                        <h3 class="card-title text-center">Create User</h3>
                        <form th:action="@{/user/create}" method="post" th:object="${user}">
                            <!-- Username Field -->
                            <div class="form-group">
                                <label for="username">Username:</label>
                                <input type="text" class="form-control" id="username" th:field="*{username}"
                                    placeholder="Enter username" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                            </div>

                            <!-- Address Field -->
                            <div class="form-group">
                                <label for="address">Address:</label>
                                <input type="text" class="form-control" id="address" th:field="*{address}"
                                    placeholder="Enter address" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                            </div>

                            <!-- Password Field -->
                            <div class="form-group">
                                <label for="password">Password:</label>
                                <input type="password" class="form-control" id="password" th:field="*{password}"
                                    placeholder="Enter password" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>

                            <!-- Confirm Password Field -->
                            <div class="form-group">
                                <label for="confirmPassword">Confirm Password:</label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                    placeholder="Re-enter password" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                            </div>

                            <!-- Email Field -->
                            <div class="form-group">
                                <label for="email">Email:</label>
                                <input type="email" class="form-control" id="email" th:field="*{email}"
                                    placeholder="Enter email" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <!-- First Name Field -->
                            <div class="form-group">
                                <label for="firstName">First Name:</label>
                                <input type="text" class="form-control" id="firstName" th:field="*{firstName}"
                                    placeholder="Enter first name" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                            </div>

                            <!-- Last Name Field -->
                            <div class="form-group">
                                <label for="lastName">Last Name:</label>
                                <input type="text" class="form-control" id="lastName" th:field="*{lastName}"
                                    placeholder="Enter last name" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                            </div>

                            <!-- Phone Number Field -->
                            <div class="form-group">
                                <label for="phone">Phone Number:</label>
                                <input type="text" class="form-control" id="phone" th:field="*{phone}"
                                    placeholder="Enter phone number" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                            </div>

                            <!-- Date of Birth Field -->
                            <div class="form-group">
                                <label for="dob">Date of Birth:</label>
                                <input type="date" class="form-control" id="dob" th:field="*{dob}" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('dob')}" th:errors="*{dob}"></div>
                            </div>

                            <!-- Account Type Field -->
                            <div class="form-group">
                                <label for="accountType">Account Type:</label>
                                <select id="accountType" class="form-control" th:field="*{accountType}" required>
                                    <option value="" disabled selected>Select Account Type</option>
                                    <option value="SAVINGS">Savings</option>
                                    <option value="CHECKING">Checking</option>
                                    <option value="LOAN">Loan</option>
                                </select>
                                <div class="text-danger" th:if="${#fields.hasErrors('accountType')}" th:errors="*{accountType}"></div>
                            </div>

                            <!-- Role Selection Field -->
                            <div class="form-group">
                                <label for="roles">Select Role:</label>
                                <select id="roles" th:field="*{roles}" multiple class="form-control select2" required>
                                    <option th:each="role : ${allRoles}" th:value="${role.id}" th:text="${role.name}"></option>
                                </select>
                                <small class="form-text text-muted">Hold down the Ctrl (Windows) or Command (Mac) key to select multiple roles.</small>
                                <div class="text-danger" th:if="${#fields.hasErrors('roles')}" th:errors="*{roles}"></div>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="btn btn-primary btn-block">Create User</button>
                        </form>

                        <!-- Back to User List -->
                        <p class="text-center mt-3">
                            Back to <a th:href="@{/user/manage_users}">User List</a>
                        </p>

                        <!-- Success/Error Messages -->
                        <p th:if="${message}" th:text="${message}" class="text-success text-center mt-3"></p>
                        <p th:if="${error}" th:text="${error}" class="text-danger text-center mt-3"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Include Footer -->
    <div th:replace="fragments/footer.html"></div>

    <!-- Include jQuery, Bootstrap JS and Select2 JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>

    <script>
        $(document).ready(function () {
            $('.select2').select2({
                placeholder: "Select roles",
                allowClear: true,
                width: '100%'
            });
        });
    </script>
</body>

</html>
