<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Bank Management System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/styles.css">
	<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
	rel="stylesheet">
<!-- FontAwesome for Icons -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>
/* Sidebar styles */
#sidebar {
	height: 100vh;
	background-color: #343a40;
	padding: 10px;
	position: relative;
	align-items: center;
}

.sidebar .nav-link {
	color: #adb5bd;
	font-weight: 500;
	padding: 10px 20px;
	border-radius: 4px;
	transition: background-color 0.3s, color 0.3s;
}

.sidebar .nav-link:hover, .sidebar .nav-link.active {
	background-color: #007bff;
	color: white;
}

.sidebar .nav-link i {
	margin-right: 10px;
}

/* Main content styles */
#main-content {
	transition: margin-left 0.3s;
}

.sidebar-collapsed {
	width: 80px;
}

.sidebar-expanded {
	width: 250px;
}

.sidebar-collapsed .nav-link span {
	display: none;
}

.sidebar-collapsed .nav-link i {
	margin-right: 0;
}

/* Sidebar toggle button */
.sidebar-toggle {
	position: absolute;
	top: 20px;
	right: 10px;
	cursor: pointer;
	transform: translateX(-50%);
}

.rotate-icon {
	transform: rotate(180deg);
}
</style>
</head>
<body>
  <!-- Include Header based on Role -->
	<div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
		<div th:replace="fragments/admin-header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''USER'')')}">
		<div th:replace="fragments/header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''TELLER'')')}">
		<div th:replace="fragments/teller-header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''SUPPORT'')')}">
		<div th:replace="fragments/support-header.html"></div>
	</div>

    <div class="container mt-5">
        <h1 class="text-center mb-4">User Profile</h1>

        <!-- User Information -->
        <h2 class="mb-3">Profile Information</h2>
        <table class="table table-bordered">
            <tbody>
                <tr>
                    <th>Username:</th>
                    <td th:text="${user.username}"></td>
                </tr>
                <tr>
                    <th>Email:</th>
                    <td th:text="${user.email}"></td>
                </tr>
                <tr>
                    <th>First Name:</th>
                    <td th:text="${user.firstName}"></td>
                </tr>
                <tr>
                    <th>Last Name:</th>
                    <td th:text="${user.lastName}"></td>
                </tr>
                <tr>
                    <th>Phone:</th>
                    <td th:text="${user.phone}"></td>
                </tr>
                <tr>
                    <th>Address:</th>
                    <td th:text="${user.address}"></td>
                </tr>
                <tr>
                    <th>Date of Birth:</th>
                    <td th:text="${user.dob}"></td>
                </tr>
                <tr>
                    <th>Account Type:</th>
                    <td th:text="${user.accountType}"></td>
                </tr>
                <tr>
                    <th>Registration Date:</th>
                    <td th:text="${user.registrationDate}"></td>
                </tr>
            </tbody>
        </table>

        <!-- Actions Section -->
        <h2 class="mb-3">Actions</h2>
        <div class="d-flex justify-content-between">
            <form th:action="@{/user/manage_profile}" method="get">
                <button type="submit" class="btn btn-primary">Edit Profile</button>
            </form>


            <form th:action="@{/support/profile/delete}" method="post" onsubmit="return confirm('Are you sure you want to delete your account?');">
                <button type="submit" class="btn btn-danger">Delete Account</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-4">
        <div class="container text-center">
            <p>&copy; 2024 Bank Management System. All Rights Reserved.</p>
        </div>
    </footer>
	
    
</body>
</html>
