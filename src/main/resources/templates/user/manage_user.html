<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Bank Management System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .sidebar-collapsed {
            width: 60px;
        }

        .sidebar-expanded {
            width: 250px;
        }

        /* Additional styling for form responsiveness */
        @media (max-width: 768px) {
            .sidebar-expanded {
                display: none;
            }

            .sidebar-collapsed {
                display: block;
            }
        }

        /* Ensuring table is fully responsive */
        .table-responsive {
            overflow-x: auto; /* Allows horizontal scroll if needed */
        }
    </style>
</head>

<body>
    <!-- Include Header based on Role -->
    <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
        <div th:replace="fragments/admin-header.html"></div>
    </div>
    <div th:if="${#authorization.expression('hasRole(''USER'')')}">
        <div th:replace="fragments/header.html"></div>
    </div>
    <div th:if="${#authorization.expression('hasRole(''TELLER'')')}">
        <div th:replace="fragments/teller-header.html"></div>
    </div>
    <div th:if="${#authorization.expression('hasRole(''SUPPORT'')')}">
        <div th:replace="fragments/support-header.html"></div>
    </div>

    <div class="d-flex">
        <!-- Sidebar -->
        <nav id="sidebar" class="bg-dark sidebar-expanded">
            <ul class="nav flex-column mt-4 sidebar">
                <li class="nav-item">
                    <span>
                        <button class="btn btn-secondary sidebar-toggle" onclick="toggleSidebar()">
                            <i class="fas fa-bars" id="toggleIcon"></i>
                        </button>
                    </span>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/overview}">
                        <i class="fas fa-tachometer-alt"></i> <span>Overview</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/user/manage_users}">
                        <i class="fas fa-users"></i> <span>Manage Users</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/loan/list}">
                        <i class="fas fa-file-invoice-dollar"></i> <span>Loans</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/transactions/admin}">
                        <i class="fas fa-money-check-alt"></i> <span>Transactions</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/atm/list}">
                        <i class="fas fa-university"></i> <span>ATM Services</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/support/list}">
                        <i class="fas fa-life-ring"></i> <span>Support</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/settings}">
                        <i class="fas fa-cogs"></i> <span>Settings</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/logout}">
                        <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div id="main-content" class="container-fluid p-4" style="min-height: 100vh; background-color: #f8f9fa;">
            <h1 class="display-6">User Management</h1>

            <!-- User Search -->
            <form class="mb-3" th:action="@{/user/search}" method="get">
                <div class="input-group">
                    <input type="text" name="query" class="form-control" placeholder="Search by username..." required>
                    <button class="btn btn-primary" type="submit">Search</button>
                </div>
            </form>

            <!-- User List -->
            <div class="card shadow-sm mt-4">
                <div class="card-body">
                    <div class="table-responsive"> <!-- Make the table responsive -->
                        <table class="table table-bordered table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Roles</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${users}">
                                    <td th:text="${user.id}"></td>
                                    <td th:text="${user.username}"></td>
                                    <td th:text="${user.email}"></td>
                                    <td>
                                        <span th:each="role : ${user.roles}" th:text="${role.name}">Role Name</span>
                                    </td>
                                    <td th:text="${user.enabled ? 'Active' : 'Inactive'}"></td>
                                    <td>
                                        <a th:href="@{/user/edit/{id}(id=${user.id})}" class="btn btn-info">Edit</a>
                                        <a th:href="@{/user/delete/{id}(id=${user.id})}" class="btn btn-danger">Delete</a>
                                        <a th:href="@{/user/toggle/{id}(id=${user.id})}" class="btn" th:class="${user.enabled ? 'btn-warning' : 'btn-success'}" 
                                           th:text="${user.enabled ? 'Deactivate' : 'Activate'}"></a>
                                        <!-- Role change dropdown -->
                                        <form th:action="@{/user/updateRole/{id}(id=${user.id})}" method="post" style="display:inline;">
                                            <select name="role" class="form-select d-inline" style="width:auto;">
                                                <option value="" disabled selected>Select Role</option>
                                                <option th:each="role : ${roles}" th:value="${role.name}" th:text="${role.name}"></option>
                                            </select>
                                            <button type="submit" class="btn btn-sm btn-secondary">Change Role</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Button to Add New User -->
            <div class="mt-3">
                <a th:href="@{/user/create}" class="btn btn-success">Add New User</a>
                 </div>
        </div>
    </div>

    <script>
        // Sidebar toggle function
        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const mainContent = document.getElementById("main-content");
            const toggleIcon = document.getElementById("toggleIcon");

            if (sidebar.classList.contains("sidebar-expanded")) {
                sidebar.classList.remove("sidebar-expanded");
                sidebar.classList.add("sidebar-collapsed");
                mainContent.classList.remove("col-10");
                mainContent.classList.add("col-12");
                toggleIcon.classList.add("rotate-icon");
            } else {
                sidebar.classList.remove("sidebar-collapsed");
                sidebar.classList.add("sidebar-expanded");
                mainContent.classList.remove("col-12");
                mainContent.classList.add("col-10");
                toggleIcon.classList.remove("rotate-icon");
            }
        }
    </script>
</body>

</html>
