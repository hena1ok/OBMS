<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Manage Profile</title>

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
	rel="stylesheet">
<!-- Custom CSS -->
<link rel="stylesheet" href="/css/styles.css">

<style>
/* Optional custom styling for a more professional look */
.profile-card {
	margin-top: 50px;
	padding: 20px;
	border-radius: 10px;
	box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

.form-control:focus {
	box-shadow: none;
	border-color: #007bff;
}

.btn-primary {
	background-color: #007bff;
	border-color: #007bff;
}

.btn-secondary {
	background-color: #6c757d;
	border-color: #6c757d;
}
</style>
</head>
<body>
	<!-- Include Header based on Role -->
	<div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
		<div th:replace="fragments/admin-header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''USER'')')}">
		<div th:replace="fragments/header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''TELLER'')')}">
		<div th:replace="fragments/teller-header.html"></div>
	</div>
	<div th:if="${#authorization.expression('hasRole(''SUPPORT'')')}">
		<div th:replace="fragments/support-header.html"></div>
	</div>


	<div class="container">
		<div class="row justify-content-center">
			<div class="col-md-8">
				<!-- Profile Form Card -->
				<div class="card profile-card">
					<div class="card-header text-center">
						<h2>Manage Profile</h2>
					</div>
					<div class="card-body">
						<!-- Success or Error Messages -->
						<div th:if="${success}" class="alert alert-success" role="alert">
							<p th:text="${success}"></p>
						</div>
						<div th:if="${error}" class="alert alert-danger" role="alert">
							<p th:text="${error}"></p>
						</div>

						<form th:action="@{/users/profile}" method="post"
							th:object="${user}" onsubmit="return validatePassword()">
							<input type="hidden" th:field="*{id}" />
							<div class="mb-3">
								<label for="username" class="form-label">Username</label> <input
									type="text" id="username" th:field="*{username}"
									class="form-control" required />
							</div>

							<div class="mb-3">
								<label for="email" class="form-label">Email</label> <input
									type="email" id="email" th:field="*{email}"
									class="form-control" required />
							</div>

							<div class="mb-3">
								<label for="password" class="form-label">New Password
									(leave blank to keep current)</label> <input type="password"
									id="password" th:field="*{password}" class="form-control" />
							</div>

							<div class="mb-3">
								<label for="confirmPassword" class="form-label">Confirm
									New Password</label> <input type="password" id="confirmPassword"
									class="form-control" />
							</div>

							<div class="d-grid gap-2">
								<button type="submit" class="btn btn-primary">Save
									Changes</button>
								<a th:href="@{/}" class="btn btn-secondary">Cancel</a>
							</div>
						</form>

					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Simple Password validation -->
	<script>
		function validatePassword() {
			var password = document.getElementById("password").value;
			var confirmPassword = document.getElementById("confirmPassword").value;
			if (password && password !== confirmPassword) {
				alert("Passwords do not match!");
				return false;
			}
			return true;
		}
	</script>
</body>
</html>
